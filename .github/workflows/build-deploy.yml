name: 'Build and Deploy'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  ENVIRONMENT_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  AZURE_ENV_SUFFIX: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Lint & Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        continue-on-error: true
        run: npm run lint

      - name: Run backend tests
        continue-on-error: true
        run: npm run test:backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FRONTEND_URL: http://localhost:4200

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure
    needs: build-and-test
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Azure Resource Names from Terraform Output
        id: tf-output
        run: |
          # Derive resource names from naming convention
          RG_NAME="rg-elearning-${{ env.AZURE_ENV_SUFFIX }}"
          ACR_NAME="elearning${{ env.AZURE_ENV_SUFFIX }}"  # terraform: ${replace(var.app_name, "-", "")}${var.environment}
          
          echo "resource_group=${RG_NAME}" >> $GITHUB_OUTPUT
          echo "acr_name=${ACR_NAME}" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ steps.tf-output.outputs.acr_name }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.tf-output.outputs.acr_name }}.azurecr.io/e-learning-backend:latest
            ${{ steps.tf-output.outputs.acr_name }}.azurecr.io/e-learning-backend:${{ github.sha }}

      - name: Update backend Container App
        run: |
          az containerapp update \
            --name "ca-elearning-backend-${{ env.AZURE_ENV_SUFFIX }}" \
            --resource-group "${{ steps.tf-output.outputs.resource_group }}" \
            --image "${{ steps.tf-output.outputs.acr_name }}.azurecr.io/e-learning-backend:${{ github.sha }}"

      - name: Get Storage Account Name
        id: storage
        run: |
          SA_NAME=$(az storage account list --resource-group "${{ steps.tf-output.outputs.resource_group }}" --query "[0].name" -o tsv)
          echo "account_name=${SA_NAME}" >> $GITHUB_OUTPUT

      - name: Get Backend URL for Frontend Build
        id: backend-url
        run: |
          BACKEND_URL=$(az containerapp show --name "ca-elearning-backend-${{ env.AZURE_ENV_SUFFIX }}" --resource-group "${{ steps.tf-output.outputs.resource_group }}" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "api_url=https://${BACKEND_URL}" >> $GITHUB_OUTPUT

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: ${{ steps.backend-url.outputs.api_url }}

      - name: Upload frontend to Storage static website
        run: |
          az storage blob upload-batch \
            --account-name "${{ steps.storage.outputs.account_name }}" \
            --destination '$web' \
            --source frontend/dist \
            --overwrite \
            --auth-mode login

      # CDN désactivé dans Terraform (frontend servi via Storage Static Website).
      # Purge CDN volontairement supprimée pour éviter des échecs/configs inutiles.

