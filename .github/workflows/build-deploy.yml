name: 'Build and Deploy'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  ENVIRONMENT_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  AZURE_ENV_SUFFIX: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Lint & Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        continue-on-error: true
        run: npm run lint

      - name: Run backend tests
        continue-on-error: true
        run: npm run test:backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FRONTEND_URL: http://localhost:4200

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure
    needs: build-and-test
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      CDN_PROFILE: ${{ secrets.CDN_PROFILE }}
      CDN_ENDPOINT: ${{ secrets.CDN_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d'.' -f1)
          echo "ACR_NAME=${ACR_NAME}" >> $GITHUB_ENV
          az acr login --name $ACR_NAME

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/e-learning-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/e-learning-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update backend Container App
        run: |
          az containerapp update \
            --name "ca-elearning-backend-${{ env.AZURE_ENV_SUFFIX }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/e-learning-backend:${{ github.sha }}"

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload frontend to Storage static website
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.FRONTEND_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source frontend/dist \
            --overwrite \
            --auth-mode login

      # CDN désactivé dans Terraform (frontend servi via Storage Static Website).
      # Purge CDN volontairement supprimée pour éviter des échecs/configs inutiles.

